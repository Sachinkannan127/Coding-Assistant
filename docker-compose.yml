version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: codepilot-backend
    restart: unless-stopped
    ports:
      - "8005:8005"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8005
      - ENVIRONMENT=production
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8005/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: codepilot-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8005
    depends_on:
      backend:
        condition: service_healthy
